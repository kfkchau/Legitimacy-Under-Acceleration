    }

    function getSelectionDescriptor(item) {
      const node = item.kind === "actor" ? actorMap.get(item.id) : lawMap.get(item.id);
      if (!node) return null;
      return {
        ...item,
        label: node.label,
        color: node.color,
        sub: item.kind === "actor"
          ? node.category
          : [node.jurisdiction, node.layer, node.year].filter(Boolean).join(" | "),
      };
    }

    function buildFocusGraphModel() {
      const selections = state.selectedNodes
        .map(getSelectionDescriptor)
        .filter(Boolean)
        .slice(-MAX_SELECTED_NODES);

      const filteredEdges = GRAPH_DATA.edges.filter(edgeMatchesFilters);
      const selectedActors = new Set(selections.filter(item => item.kind === "actor").map(item => item.id));
      const selectedLaws = new Set(selections.filter(item => item.kind === "law").map(item => item.id));
      const actorSupport = new Map();
      const lawSupport = new Map();

      filteredEdges.forEach(edge => {
        if (selectedActors.has(edge.actorId)) {
          lawSupport.set(edge.lawId, (lawSupport.get(edge.lawId) || 0) + 1);
        }
        if (selectedLaws.has(edge.lawId)) {
          actorSupport.set(edge.actorId, (actorSupport.get(edge.actorId) || 0) + 1);
        }
      });

      const chosenActorIds = new Set(selectedActors);
      const chosenLawIds = new Set(selectedLaws);
      let chosenEdges = [];
      let note = "";

      if (!selections.length) {
        return { selections, note, nodes: [], edges: [] };
      }

      if (selectedActors.size && selectedLaws.size) {
        chosenEdges = filteredEdges.filter(edge => selectedActors.has(edge.actorId) && selectedLaws.has(edge.lawId));
        note = chosenEdges.length
          ? "Mixed selections show the direct links between the chosen actors and laws."
          : "These selected actors and laws do not connect inside the current filters.";
      } else if (selectedActors.size) {
        const rankedLawIds = [...lawSupport.entries()]
          .filter(([, count]) => count > 0)
          .sort((left, right) => right[1] - left[1] || lawMap.get(left[0]).label.localeCompare(lawMap.get(right[0]).label))
          .slice(0, selections.length === 1 ? 16 : 14)
          .map(([lawId]) => lawId);
        rankedLawIds.forEach(lawId => chosenLawIds.add(lawId));
        chosenEdges = filteredEdges.filter(edge => selectedActors.has(edge.actorId) && chosenLawIds.has(edge.lawId));
        note = selections.length === 1
          ? "Single selection view shows the chosen item and its immediate neighborhood."
          : "Shared laws rise to the top when multiple actors are selected.";
      } else {
        const rankedActorIds = [...actorSupport.entries()]
          .filter(([, count]) => count > 0)
          .sort((left, right) => right[1] - left[1] || actorMap.get(left[0]).label.localeCompare(actorMap.get(right[0]).label))
          .slice(0, selections.length === 1 ? 16 : 14)
          .map(([actorId]) => actorId);
        rankedActorIds.forEach(actorId => chosenActorIds.add(actorId));
        chosenEdges = filteredEdges.filter(edge => chosenActorIds.has(edge.actorId) && selectedLaws.has(edge.lawId));
        note = selections.length === 1
          ? "Single selection view shows the chosen item and its immediate neighborhood."
          : "Shared actors rise to the top when multiple laws are selected.";
      }

      const actorNodes = [...chosenActorIds]
        .map(actorId => {
          const actor = actorMap.get(actorId);
          const support = actorSupport.get(actorId) || 0;
          if (!actor) return null;
          return {
            kind: "actor",
            id: actor.id,
            label: actor.label,
            color: actor.color,
            selected: selectedActors.has(actor.id),
            support,
            sub: selectedActors.has(actor.id) ? actor.category : (support > 1 ? `shared by ${support} selected laws` : actor.category),
          };
        })
        .filter(Boolean)
        .sort((left, right) =>
          Number(right.selected) - Number(left.selected) ||
          right.support - left.support ||
          left.label.localeCompare(right.label)
        );

      const lawNodes = [...chosenLawIds]
        .map(lawId => {
          const law = lawMap.get(lawId);
          const support = lawSupport.get(lawId) || 0;
          if (!law) return null;
          return {
            kind: "law",
            id: law.id,
            label: law.label,
            color: law.color,
            selected: selectedLaws.has(law.id),
            support,
            sub: selectedLaws.has(law.id)
              ? [law.jurisdiction, law.layer, law.year].filter(Boolean).join(" | ")
              : (support > 1 ? `shared by ${support} selected actors` : law.jurisdiction),
          };
        })
        .filter(Boolean)
        .sort((left, right) =>
          Number(right.selected) - Number(left.selected) ||
          right.support - left.support ||
          left.label.localeCompare(right.label)
        );

      return {
        selections,
        note,
        nodes: [...actorNodes, ...lawNodes],
        actors: actorNodes,
        laws: lawNodes,
        edges: chosenEdges,
      };
    }

    function renderFocusGraph() {
      const model = buildFocusGraphModel();
      const selectionChips = model.selections.map(item => `
        <span class="focus-selection-chip">
          <span>${escapeHtml(item.label)}</span>
          <button type="button" data-remove-selection="${escapeHtml(selectionKey(item.kind, item.id))}" aria-label="Remove ${escapeHtml(item.label)}">&times;</button>
        </span>
      `).join("");

      if (!model.selections.length) {
        focusGraphPanel.innerHTML = `
          <div class="window-handle">
            <div class="window-title-wrap">
              <span class="window-kicker">Tool</span>
              <h2>Graph</h2>
            </div>
            <div class="window-actions">
              <button class="window-close" type="button" data-close-window="focusGraphPanel" aria-label="Close Graph">&times;</button>
            </div>
          </div>
          <div class="focus-graph-empty">Select up to three actors or laws from the main graph or the search + button, and this panel will show the local network between them.</div>
        `;
        return;
      }

      const width = 320;
      const rowCount = Math.max(model.actors.length, model.laws.length, 1);
      const height = Math.max(220, 92 + rowCount * 48);
      const actorX = 92;
      const lawX = 228;
      const actorPositions = new Map();
      const lawPositions = new Map();
      const actorGap = model.actors.length > 1 ? (height - 116) / (model.actors.length - 1) : 0;
      const lawGap = model.laws.length > 1 ? (height - 116) / (model.laws.length - 1) : 0;

      model.actors.forEach((node, index) => {
        const y = model.actors.length === 1 ? height / 2 : 58 + actorGap * index;
        actorPositions.set(node.id, { x: actorX, y });
      });
      model.laws.forEach((node, index) => {
        const y = model.laws.length === 1 ? height / 2 : 58 + lawGap * index;
        lawPositions.set(node.id, { x: lawX, y });
      });

      const edgeMarkup = model.edges.map(edge => {
        const actorPos = actorPositions.get(edge.actorId);
        const lawPos = lawPositions.get(edge.lawId);
        if (!actorPos || !lawPos) return "";
        const midX = (actorPos.x + lawPos.x) / 2;
        const path = `M ${actorPos.x} ${actorPos.y} C ${midX - 28} ${actorPos.y}, ${midX + 28} ${lawPos.y}, ${lawPos.x} ${lawPos.y}`;
        const color = roleColors[edge.primaryRole] || "rgba(220,220,230,0.9)";
        return `
          <path
            class="focus-edge"
            data-focus-edge-id="${escapeHtml(edge.id)}"
            d="${path}"
            fill="none"
            stroke="${color}"
            stroke-opacity="${model.selections.length > 1 ? 0.7 : 0.56}"
            stroke-width="${1.1 + Math.min(2, Math.log(edge.mappingCount + 1))}"
            ${edge.primaryRole === "Rule User" ? `stroke-dasharray="3 6"` : ""}
          ></path>
        `;
      }).join("");

      const actorMarkup = model.actors.map(node => {
        const pos = actorPositions.get(node.id);
        return `
          <g class="focus-node" data-focus-kind="actor" data-focus-id="${escapeHtml(node.id)}" transform="translate(${pos.x}, ${pos.y})" style="cursor:pointer">
            <circle r="${node.selected ? 9 : 7}" fill="${node.selected ? node.color : "rgba(208,208,216,0.88)"}" fill-opacity="${node.selected ? 0.92 : 0.75}" stroke="${node.selected ? node.color : "rgba(255,255,255,0.28)"}" stroke-width="${node.selected ? 2 : 1.2}"></circle>
            <text x="-12" y="-2" text-anchor="end" fill="rgba(255,255,255,0.88)" font-size="10.5" style="font-family: var(--display);">${escapeHtml(node.label)}</text>
            <text x="-12" y="11" text-anchor="end" fill="rgba(255,255,255,0.3)" font-size="8.6" style="font-family: var(--mono);">${escapeHtml(node.sub)}</text>
          </g>
        `;
      }).join("");

      const lawMarkup = model.laws.map(node => {
        const pos = lawPositions.get(node.id);
        return `
          <g class="focus-node" data-focus-kind="law" data-focus-id="${escapeHtml(node.id)}" transform="translate(${pos.x}, ${pos.y})" style="cursor:pointer">
            <circle r="${node.selected ? 9 : 7}" fill="${node.selected ? node.color : "rgba(208,208,216,0.88)"}" fill-opacity="${node.selected ? 0.92 : 0.75}" stroke="${node.selected ? node.color : "rgba(255,255,255,0.28)"}" stroke-width="${node.selected ? 2 : 1.2}"></circle>
            <text x="12" y="-2" text-anchor="start" fill="rgba(255,255,255,0.88)" font-size="10.5" style="font-family: var(--display);">${escapeHtml(node.label)}</text>
            <text x="12" y="11" text-anchor="start" fill="rgba(255,255,255,0.3)" font-size="8.6" style="font-family: var(--mono);">${escapeHtml(node.sub)}</text>
          </g>
        `;
      }).join("");

      focusGraphPanel.innerHTML = `
        <div class="window-handle">
          <div class="window-title-wrap">
            <span class="window-kicker">Tool</span>
            <h2>Graph</h2>
          </div>
          <div class="window-actions">
            <button class="clear-btn" id="focusGraphClearBtn" type="button">Clear</button>
            <button class="window-close" type="button" data-close-window="focusGraphPanel" aria-label="Close Graph">&times;</button>
          </div>
        </div>
        <div class="focus-selection-row">${selectionChips}</div>
        <div class="focus-graph-meta">Showing the newest ${formatCount(Math.min(model.selections.length, MAX_SELECTED_NODES))} selected item${model.selections.length === 1 ? "" : "s"}. ${escapeHtml(model.note)}</div>
        <div class="focus-graph-stage">
          <svg class="focus-graph-svg" viewBox="0 0 ${width} ${height}" aria-label="Focused local network">
            <g opacity="0.18">
              <text x="${actorX - 26}" y="18" fill="rgba(255,255,255,0.28)" style="font-family: var(--mono);" font-size="9" letter-spacing="1.8">ACTORS</text>
              <text x="${lawX - 18}" y="18" fill="rgba(255,255,255,0.28)" style="font-family: var(--mono);" font-size="9" letter-spacing="1.8">LAWS</text>
              <line x1="${actorX}" y1="28" x2="${actorX}" y2="${height - 24}" stroke="rgba(255,255,255,0.06)"></line>
              <line x1="${lawX}" y1="28" x2="${lawX}" y2="${height - 24}" stroke="rgba(255,255,255,0.06)"></line>
            </g>
            <g>${edgeMarkup}</g>
            <g>${actorMarkup}${lawMarkup}</g>
          </svg>
        </div>
      `;

      const focusGraphClearBtn = document.getElementById("focusGraphClearBtn");
      if (focusGraphClearBtn) {
        focusGraphClearBtn.addEventListener("click", () => clearSelections());
      }

      focusGraphPanel.querySelectorAll("[data-remove-selection]").forEach(button => {
        button.addEventListener("click", () => {
          const key = button.getAttribute("data-remove-selection");
          const [kind, id] = key.split(":");
          toggleSelection(kind, id);
        });
      });

      focusGraphPanel.querySelectorAll(".focus-node").forEach(node => {
        node.addEventListener("mouseenter", event => {
          const kind = event.currentTarget.getAttribute("data-focus-kind");
          const id = event.currentTarget.getAttribute("data-focus-id");
          if (kind === "actor") showTooltipForActor(actorMap.get(id), event);
          else showTooltipForLaw(lawMap.get(id), event);
        });
        node.addEventListener("mousemove", event => moveTooltip(event));
        node.addEventListener("mouseleave", () => hideTooltip());
        node.addEventListener("click", event => {
          event.stopPropagation();
          const kind = event.currentTarget.getAttribute("data-focus-kind");
          const id = event.currentTarget.getAttribute("data-focus-id");
          setPinned({ kind, id });
        });
      });

      focusGraphPanel.querySelectorAll(".focus-edge").forEach(node => {
        node.addEventListener("mouseenter", event => {
          const edge = edgeMap.get(event.currentTarget.getAttribute("data-focus-edge-id"));
          showTooltipForEdge(edge, event);
        });
        node.addEventListener("mousemove", event => moveTooltip(event));
        node.addEventListener("mouseleave", () => hideTooltip());
        node.addEventListener("click", event => {
          event.stopPropagation();
          const edgeId = event.currentTarget.getAttribute("data-focus-edge-id");
          setPinned({ kind: "edge", id: edgeId });
        });
      });
    }

      return `
        <div class="tooltip-toolbar">
          <div class="tooltip-title" style="color:${color || "#fff"}">${escapeHtml(title)}</div>
          <button class="tooltip-pin" type="button" id="tooltipPinBtn" aria-label="Pin hover card">+</button>
        </div>
        ${bodyHtml}
      `;
    }

    function showTooltip(content, payload) {
      clearTimeout(state.tooltipHideTimer);
      state.tooltipPayload = payload || null;
      tooltip.innerHTML = content;
      tooltip.classList.add("visible");
      const pinButton = document.getElementById("tooltipPinBtn");
      if (pinButton && payload) {
        pinButton.addEventListener("click", event => {
          event.stopPropagation();
          pinCurrentTooltip();
        });
      }
    }

    function hideTooltip(force) {
      if (force) {
        clearTimeout(state.tooltipHideTimer);
        tooltip.classList.remove("visible");
        return;
      }
      clearTimeout(state.tooltipHideTimer);
      state.tooltipHideTimer = setTimeout(() => {
        tooltip.classList.remove("visible");
      }, 120);
    }

    function moveTooltip(event) {
      state.lastTooltipPoint = { x: event.clientX, y: event.clientY };
      tooltip.style.left = `${event.clientX + 16}px`;
      tooltip.style.top = `${event.clientY - 10}px`;
    }

    function pinCurrentTooltip() {
      if (!state.tooltipPayload) return;
      state.pinnedCards.push({
        ...state.tooltipPayload,
        cardId: `card_${Date.now()}_${state.pinnedCards.length}`,
        left: Math.min(state.lastTooltipPoint.x + 24, window.innerWidth - 340),
        top: Math.min(state.lastTooltipPoint.y + 24, window.innerHeight - 260),
        z: nextZ(),
      });
      hideTooltip(true);
      renderPinnedCards();
    }

    function autoPinTooltipFromEvent(event) {
      moveTooltip(event);
      pinCurrentTooltip();
    }

    function renderPinnedCards() {
      pinnedCardsLayer.innerHTML = state.pinnedCards.map(card => `
        <section class="panel pinned-card" data-card-id="${escapeHtml(card.cardId)}" style="left:${card.left}px; top:${card.top}px; z-index:${card.z};">
          <div class="window-handle">
            <div class="window-title-wrap">
              <span class="window-kicker">Pinned</span>
              <h2>${escapeHtml(card.title)}</h2>
            </div>
            <div class="window-actions">
              <button class="window-close" type="button" data-close-card="${escapeHtml(card.cardId)}" aria-label="Close pinned card">&times;</button>
            </div>
          </div>
          <div class="window-body">${card.body}</div>
        </section>
      `).join("");
    }

    function showTooltipForActor(actor, event) {
      if (!actor) return;
      const body = `
        <div class="tooltip-row"><span class="tooltip-key">category</span><span class="tooltip-value">${escapeHtml(actor.category)}</span></div>
        <div class="tooltip-row"><span class="tooltip-key">laws</span><span class="tooltip-value">${formatCount(actor.degree)}</span></div>
        <div class="tooltip-row"><span class="tooltip-key">mappings</span><span class="tooltip-value">${formatCount(actor.mappingCount)}</span></div>
        <div class="tooltip-row"><span class="tooltip-key">roles</span><span class="tooltip-value">${renderRoleTooltipValue(actor.roleBreakdown.slice(0, 3))}</span></div>
      `;
      showTooltip(makeTooltipContent(actor.label, actor.color, body), { title: actor.label, body });
      moveTooltip(event);
    }

    function showTooltipForLaw(law, event) {
      if (!law) return;
      const body = `
        <div class="tooltip-row"><span class="tooltip-key">jurisdiction</span><span class="tooltip-value">${escapeHtml(law.jurisdiction)}</span></div>
        <div class="tooltip-row"><span class="tooltip-key">layer</span><span class="tooltip-value">${escapeHtml(law.layer)}</span></div>
        <div class="tooltip-row"><span class="tooltip-key">year</span><span class="tooltip-value">${law.year ? escapeHtml(law.year) : "n/a"}</span></div>
        <div class="tooltip-row"><span class="tooltip-key">actors</span><span class="tooltip-value">${formatCount(law.degree)}</span></div>
      `;
      showTooltip(makeTooltipContent(law.label, law.color, body), { title: law.label, body });
      moveTooltip(event);
    }

    function showTooltipForEdge(edge, event) {
      if (!edge) return;
      const edgeTitle = `${edge.actorLabel} to ${edge.lawLabel}`;
      const body = `
        <div class="tooltip-row"><span class="tooltip-key">role mix</span><span class="tooltip-value">${renderRoleTooltipValue(edge.roleBreakdown)}</span></div>
        <div class="tooltip-row"><span class="tooltip-key">jurisdiction</span><span class="tooltip-value">${escapeHtml(edge.jurisdiction)}</span></div>
        <div class="tooltip-row"><span class="tooltip-key">resources</span><span class="tooltip-value">${escapeHtml(edge.resources.slice(0, 4).join(", "))}${edge.resources.length > 4 ? "..." : ""}</span></div>
      `;
      showTooltip(makeTooltipContent(edgeTitle, roleColors[edge.primaryRole] || "#fff", body), { title: edgeTitle, body });
      moveTooltip(event);
    }

    function updateSearchResults() {
      const query = normalizeText(searchInput.value);
      searchClear.style.display = query ? "block" : "none";

      if (!query) {
        state.searchResults = [];
        state.selectedSearchIndex = -1;
        hideSearch();
        return;
      }

      const tokens = query.split(/\s+/).filter(Boolean);
      const matches = SEARCH_INDEX.filter(item => tokens.every(token => item.key.includes(token))).slice(0, 24);
      state.searchResults = matches;
      state.selectedSearchIndex = -1;

      if (!matches.length) {
        searchDropdown.innerHTML = `<div class="search-category">No matches</div>`;
        searchDropdown.classList.add("visible");
        return;
      }

      const grouped = new Map();
      matches.forEach((item, flatIndex) => {
        const enriched = { ...item, flatIndex };
        if (!grouped.has(item.type)) grouped.set(item.type, []);
        grouped.get(item.type).push(enriched);
      });

      const html = [];
      grouped.forEach((items, type) => {
        html.push(`<div class="search-category">${escapeHtml(type)}</div>`);
        items.forEach(item => {
          const isSelectable = Boolean(item.selection);
          const selectionActive = isSelectable && state.selectedNodes.some(node => selectionKey(node.kind, node.id) == selectionKey(item.selection.kind, item.selection.id));
          html.push(`
            <div class="search-result" data-search-index="${item.flatIndex}">
              <span class="search-result-main">
                <span class="search-result-label">${escapeHtml(item.label)}</span>
                <span class="search-result-sub">${escapeHtml(item.sub)}</span>
              </span>
              <span class="search-result-actions">
                ${isSelectable ? `<button class="search-add" type="button" data-search-add="${item.flatIndex}" aria-label="Add as filter">${selectionActive ? "•" : "+"}</button>` : ""}
              </span>
            </div>
          `);
        });
      });

      searchDropdown.innerHTML = html.join("");
      searchDropdown.classList.add("visible");
      searchDropdown.querySelectorAll("[data-search-index]").forEach(node => {
        node.addEventListener("mousedown", event => {
          if (event.target.closest("[data-search-add]")) return;
          event.preventDefault();
          runSearchAction(Number(node.getAttribute("data-search-index")));
        });
      });
      searchDropdown.querySelectorAll("[data-search-add]").forEach(node => {
        node.addEventListener("mousedown", event => {
          event.preventDefault();
          event.stopPropagation();
          const item = state.searchResults[Number(node.getAttribute("data-search-add"))];
          if (!item || !item.selection) return;
          toggleSelection(item.selection.kind, item.selection.id);
        });
      });
    }

    function runSearchAction(index) {
      const item = state.searchResults[index];
      if (!item) return;
      item.action();
      searchInput.value = item.label;
      searchClear.style.display = "block";
    }

    function hideSearch() {
      searchDropdown.classList.remove("visible");
    }

    function highlightSearchIndex() {
      searchDropdown.querySelectorAll("[data-search-index]").forEach(node => {
        const nodeIndex = Number(node.getAttribute("data-search-index"));
        node.classList.toggle("highlighted", nodeIndex === state.selectedSearchIndex);
        if (nodeIndex === state.selectedSearchIndex) {
          node.scrollIntoView({ block: "nearest" });
        }
      });
    }

    function attachSearchEvents() {
      searchInput.addEventListener("input", updateSearchResults);
      searchInput.addEventListener("keydown", event => {
        if (!state.searchResults.length) return;
        if (event.key === "ArrowDown") {
          event.preventDefault();
          state.selectedSearchIndex = Math.min(state.selectedSearchIndex + 1, state.searchResults.length - 1);
          highlightSearchIndex();
        } else if (event.key === "ArrowUp") {
          event.preventDefault();
          state.selectedSearchIndex = Math.max(state.selectedSearchIndex - 1, 0);
          highlightSearchIndex();
        } else if (event.key === "Enter") {
          event.preventDefault();
          const chosenIndex = state.selectedSearchIndex >= 0 ? state.selectedSearchIndex : 0;
          runSearchAction(chosenIndex);
        } else if (event.key === "Escape") {
          hideSearch();
        }
      });

      searchClear.addEventListener("click", () => {
        searchInput.value = "";
        updateSearchResults();
        searchInput.focus();
      });

      document.addEventListener("click", event => {
        if (!event.target.closest("#searchPanel")) {
          hideSearch();
        }
      });
    }

    function attachGlobalInteractions() {
      toolToggle.addEventListener("click", event => {
        event.stopPropagation();
        toggleToolMenu();
      });

      tooltip.addEventListener("mouseenter", () => {
        clearTimeout(state.tooltipHideTimer);
      });
      tooltip.addEventListener("mouseleave", () => hideTooltip());

      document.addEventListener("click", event => {
        if (!event.target.closest("#toolLauncher")) {
          toggleToolMenu(false);
        }

        const closeWindowButton = event.target.closest("[data-close-window]");
        if (closeWindowButton) {
          closeWindow(closeWindowButton.getAttribute("data-close-window"));
          return;
        }

        const closeCardButton = event.target.closest("[data-close-card]");
        if (closeCardButton) {
          state.pinnedCards = state.pinnedCards.filter(card => card.cardId !== closeCardButton.getAttribute("data-close-card"));
          renderPinnedCards();
        }
      });

      document.addEventListener("mousedown", event => {
        if (event.target.closest(".window-actions") || event.target.closest("button") || event.target.closest("input") || event.target.closest("select")) {
          return;
        }
        const handle = event.target.closest(".window-handle");
        if (!handle) return;

        const card = handle.closest("[data-card-id]");
        if (card) {
          const cardId = card.getAttribute("data-card-id");
          const cardState = state.pinnedCards.find(item => item.cardId === cardId);
          if (!cardState) return;
          cardState.z = nextZ();
          state.draggingWindow = {
            type: "card",
            cardId,
            offsetX: event.clientX - cardState.left,
            offsetY: event.clientY - cardState.top,
          };
          renderPinnedCards();
          return;
        }

        const panel = handle.closest(".panel");
        if (!panel || !panel.id) return;
        const win = getWindowState(panel.id);
        if (!win) return;
        bringWindowToFront(panel.id);
        state.draggingWindow = {
          type: "panel",
          panelId: panel.id,
          offsetX: event.clientX - win.left,
          offsetY: event.clientY - win.top,
        };
      });

      document.addEventListener("mousemove", event => {
        if (state.draggingWindow) {
          if (state.draggingWindow.type === "panel") {
            const win = getWindowState(state.draggingWindow.panelId);
            if (!win) return;
            win.left = Math.max(12, event.clientX - state.draggingWindow.offsetX);
            win.top = Math.max(12, event.clientY - state.draggingWindow.offsetY);
            applyWindowState();
          } else {
            const card = state.pinnedCards.find(item => item.cardId === state.draggingWindow.cardId);
            if (!card) return;
            card.left = Math.max(12, event.clientX - state.draggingWindow.offsetX);
            card.top = Math.max(12, event.clientY - state.draggingWindow.offsetY);
            renderPinnedCards();
          }
        }

        if (state.draggingGroup) {
          const layout = getLayout();
          const side = state.draggingGroup.side;
          const groupLayouts = side === "actor" ? layout.actorGroups : layout.lawGroups;
          const mode = getGroupingMode(side);
          if (mode === "none" || groupLayouts.length < 2) return;
          const rect = svg.getBoundingClientRect();
          const pointerY = event.clientY - rect.top;
          const targetIndex = groupLayouts.reduce((bestIndex, group, index, list) => {
            const bestDistance = Math.abs(pointerY - list[bestIndex].centerY);
            const distance = Math.abs(pointerY - group.centerY);
            return distance < bestDistance ? index : bestIndex;
          }, 0);
          const order = [...groupLayouts.map(group => group.key)];
          const currentIndex = order.indexOf(state.draggingGroup.key);
          if (currentIndex >= 0 && targetIndex >= 0 && currentIndex !== targetIndex) {
            order.splice(currentIndex, 1);
            order.splice(targetIndex, 0, state.draggingGroup.key);
            setStoredGroupOrder(side, mode, order);
            render();
          }
        }
      });

      document.addEventListener("mouseup", () => {
        state.draggingWindow = null;
        state.draggingGroup = null;
      });
    }

    function render() {
      renderGraph();
      renderFilters();
      renderStats();
      renderDetail();
      renderFocusGraph();
      renderGrouping();
      renderLegend();
      renderToolMenu();
      applyWindowState();
      renderPinnedCards();
    }

    attachSearchEvents();
    attachGlobalInteractions();
    render();
    window.addEventListener("resize", render);
  </script>
</body>
</html>
