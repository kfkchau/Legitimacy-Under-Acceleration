<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Regulatory Network Graph</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap');

    :root {
      --bg: #0a0a0f;
      --panel: rgba(10, 10, 15, 0.85);
      --panel-strong: rgba(12, 12, 20, 0.94);
      --line: rgba(255, 255, 255, 0.08);
      --line-soft: rgba(255, 255, 255, 0.05);
      --text: #c8c8d4;
      --text-strong: rgba(255, 255, 255, 0.92);
      --text-soft: rgba(255, 255, 255, 0.62);
      --text-faint: rgba(255, 255, 255, 0.22);
      --mono: "JetBrains Mono", monospace;
      --display: "Space Grotesk", sans-serif;
      --glow-green: rgba(110, 231, 183, 0.18);
      --glow-blue: rgba(56, 189, 248, 0.18);
      --glow-pink: rgba(244, 114, 182, 0.16);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--display);
      overflow: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: auto;
      width: 44vw;
      height: 44vw;
      border-radius: 999px;
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.55;
    }

    body::before {
      top: -12vw;
      left: -8vw;
      background: radial-gradient(circle, var(--glow-blue), transparent 62%);
    }

    body::after {
      right: -10vw;
      bottom: -14vw;
      background: radial-gradient(circle, var(--glow-pink), transparent 62%);
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(129, 140, 248, 0.12), transparent 28%),
        radial-gradient(circle at 76% 18%, rgba(110, 231, 183, 0.08), transparent 26%),
        radial-gradient(circle at 50% 82%, rgba(251, 191, 36, 0.08), transparent 22%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.01), rgba(255, 255, 255, 0));
    }

    .panel {
      position: fixed;
      z-index: 20;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      backdrop-filter: blur(18px);
      box-shadow: 0 22px 80px rgba(0, 0, 0, 0.35);
    }

    .window-hidden {
      display: none !important;
    }

    #toolLauncher {
      position: fixed;
      top: 18px;
      left: 20px;
      z-index: 45;
    }

    #toolToggle {
      appearance: none;
      border: 0;
      background: transparent;
      color: rgba(255, 255, 255, 0.24);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 4px 0;
    }

    #toolToggle:hover,
    #toolLauncher.open #toolToggle {
      color: rgba(255, 255, 255, 0.7);
    }

    #toolMenu {
      display: none;
      margin-top: 10px;
      min-width: 180px;
      padding: 10px;
      border-radius: 14px;
      background: rgba(12, 12, 20, 0.95);
      border: 1px solid var(--line);
      backdrop-filter: blur(18px);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.34);
    }

    #toolLauncher.open #toolMenu {
      display: block;
    }

    .tool-menu-item {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border: 0;
      background: transparent;
      color: rgba(255, 255, 255, 0.62);
      font-family: var(--mono);
      font-size: 10px;
      text-align: left;
      padding: 9px 8px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.12s ease, color 0.12s ease;
    }

    .tool-menu-item:hover,
    .tool-menu-item.active {
      background: rgba(255, 255, 255, 0.06);
      color: rgba(255, 255, 255, 0.82);
    }

    .tool-menu-status {
      font-size: 9px;
      letter-spacing: 0.1em;
      color: rgba(255, 255, 255, 0.24);
    }

    #graphWrap {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    #graph {
      width: 100%;
      height: 100%;
      display: block;
    }

    #filtersPanel {
      top: 20px;
      left: 20px;
      width: 320px;
      max-height: calc(100vh - 180px);
      overflow: auto;
      padding: 16px 16px 14px;
    }

    #detailPanel {
      top: 132px;
      right: 20px;
      width: 330px;
      max-height: calc(100vh - 246px);
      overflow: auto;
      padding: 16px;
    }

    #statsPanel {
      top: 20px;
      right: 20px;
      width: 330px;
      padding: 14px 16px;
    }

    #groupingPanel {
      top: 286px;
      left: 20px;
      width: 330px;
      max-height: calc(100vh - 330px);
      overflow: auto;
      padding: 16px;
    }

    #legendPanel {
      top: 424px;
      right: 20px;
      width: 300px;
      max-height: calc(100vh - 460px);
      overflow: auto;
      padding: 16px;
    }

    #searchPanel {
      right: 20px;
      bottom: 20px;
      width: 330px;
      padding: 0;
      overflow: visible;
    }

    #focusGraphPanel {
      top: 306px;
      right: 20px;
      width: 360px;
      max-height: calc(100vh - 340px);
      overflow: auto;
      padding: 16px;
    }

    #titleBlock {
      position: fixed;
      left: 20px;
      bottom: 20px;
      z-index: 20;
      pointer-events: none;
      max-width: 420px;
    }

    #titleBlock h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1;
      letter-spacing: -0.04em;
      color: rgba(255, 255, 255, 0.12);
      font-weight: 700;
    }

    #titleBlock p {
      margin: 8px 0 0;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.18);
      line-height: 1.5;
    }

    .window-handle {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
      cursor: move;
      user-select: none;
    }

    .window-title-wrap {
      min-width: 0;
    }

    .window-kicker {
      display: block;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.24);
      margin-bottom: 5px;
    }

    .window-actions {
      display: inline-flex;
      gap: 6px;
      flex-shrink: 0;
      align-items: center;
    }

    .window-close,
    .tooltip-pin {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.03);
      color: rgba(255, 255, 255, 0.42);
      width: 24px;
      height: 24px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
      transition: all 0.14s ease;
    }

    .window-close:hover,
    .tooltip-pin:hover {
      color: rgba(255, 255, 255, 0.88);
      border-color: rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.08);
    }

    .window-body {
      position: relative;
    }

    .search-window-body {
      overflow: visible;
    }

    .section-label,
    .panel h2,
    .stat-label,
    .detail-kicker,
    .search-category {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.28);
    }

    .panel h2 {
      margin: 0 0 12px;
      font-weight: 500;
    }

    .toolbar-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .clear-btn,
    .ghost-btn,
    .mini-link {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-soft);
      font-family: var(--mono);
      font-size: 10px;
      line-height: 1;
      border-radius: 999px;
      padding: 8px 10px;
      cursor: pointer;
      transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease, transform 0.15s ease;
    }

    .clear-btn:hover,
    .ghost-btn:hover,
    .mini-link:hover {
      color: var(--text-strong);
      border-color: rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.06);
      transform: translateY(-1px);
    }

    .filters-group + .filters-group {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--line-soft);
    }

    .chip-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.03);
      padding: 8px 10px;
      border-radius: 999px;
      color: var(--text-soft);
      cursor: pointer;
      transition: all 0.16s ease;
      max-width: 100%;
    }

    .chip:hover {
      border-color: rgba(255, 255, 255, 0.18);
      color: var(--text-strong);
      transform: translateY(-1px);
    }

    .chip.active {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.22);
      color: var(--text-strong);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
    }

    .chip-color {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      flex-shrink: 0;
      box-shadow: 0 0 12px currentColor;
    }

    .chip-text {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .chip-label {
      font-size: 12px;
      color: inherit;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chip-count {
      font-family: var(--mono);
      font-size: 10px;
      color: rgba(255, 255, 255, 0.32);
      margin-top: 1px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .stat-card {
      padding: 12px 12px 10px;
      border-radius: 12px;
      border: 1px solid var(--line-soft);
      background: rgba(255, 255, 255, 0.03);
    }

    .stat-big {
      font-size: 36px;
      line-height: 1;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.08);
      margin-bottom: 6px;
    }

    .stat-sub {
      font-family: var(--mono);
      font-size: 10px;
      color: rgba(255, 255, 255, 0.4);
    }

    .detail-title {
      font-size: 18px;
      line-height: 1.1;
      color: var(--text-strong);
      margin: 5px 0 6px;
      letter-spacing: -0.03em;
    }

    .detail-subtitle {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.45);
      margin-bottom: 14px;
      line-height: 1.45;
    }

    .detail-meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .detail-card {
      border: 1px solid var(--line-soft);
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      padding: 10px 11px;
    }

    .detail-card .value {
      display: block;
      margin-top: 5px;
      color: var(--text-strong);
      font-size: 13px;
      line-height: 1.4;
    }

    .detail-list {
      margin-top: 14px;
      display: grid;
      gap: 8px;
    }

    .detail-item {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      border-radius: 12px;
      border: 1px solid var(--line-soft);
      background: rgba(255, 255, 255, 0.03);
      padding: 10px 11px;
    }

    .detail-item-main {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .detail-item-title {
      font-size: 12px;
      color: var(--text-strong);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .detail-item-sub {
      font-family: var(--mono);
      font-size: 10px;
      color: rgba(255, 255, 255, 0.35);
      margin-top: 3px;
    }

    .detail-item-count {
      font-family: var(--mono);
      font-size: 11px;
      color: rgba(255, 255, 255, 0.42);
      flex-shrink: 0;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .tag {
      font-family: var(--mono);
      font-size: 10px;
      color: rgba(255, 255, 255, 0.72);
      padding: 6px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .search-wrap {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
    }

    .search-icon {
      color: rgba(255, 255, 255, 0.24);
      font-size: 14px;
      flex-shrink: 0;
    }

    #searchInput {
      flex: 1;
      border: 0;
      outline: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.75);
      font-family: var(--mono);
      font-size: 12px;
    }

    #searchInput::placeholder {
      color: rgba(255, 255, 255, 0.22);
    }

    #searchClear {
      display: none;
      background: none;
      border: 0;
      color: rgba(255, 255, 255, 0.34);
      cursor: pointer;
      font-size: 16px;
      padding: 0 0 0 8px;
    }

    #searchClear:hover {
      color: rgba(255, 255, 255, 0.68);
    }

    #searchDropdown {
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(100% + 8px);
      display: none;
      max-height: 360px;
      overflow: auto;
      background: var(--panel-strong);
      border: 1px solid var(--line);
      border-radius: 14px;
      backdrop-filter: blur(18px);
      box-shadow: 0 24px 90px rgba(0, 0, 0, 0.35);
      padding: 8px 0;
    }

    #searchDropdown.visible {
      display: block;
    }

    .search-category {
      padding: 8px 14px 4px;
    }

    .search-result {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      padding: 8px 14px;
      cursor: pointer;
      transition: background 0.12s ease;
    }

    .search-result:hover,
    .search-result.highlighted {
      background: rgba(255, 255, 255, 0.06);
    }

    .search-result-label {
      font-family: var(--mono);
      font-size: 11px;
      color: rgba(255, 255, 255, 0.75);
    }

    .search-result-sub {
      font-family: var(--mono);
      font-size: 10px;
      color: rgba(255, 255, 255, 0.3);
      flex-shrink: 0;
    }

    .search-result-main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      gap: 3px;
    }

    .search-result-actions {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .search-add {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.04);
      color: rgba(255, 255, 255, 0.48);
      cursor: pointer;
      font-family: var(--mono);
      line-height: 1;
    }

    .search-add:hover {
      color: rgba(255, 255, 255, 0.88);
      border-color: rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.08);
    }

    .tooltip {
      position: fixed;
      pointer-events: auto;
      z-index: 60;
      background: rgba(12, 12, 20, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px 14px;
      backdrop-filter: blur(18px);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.38);
      max-width: 320px;
      opacity: 0;
      transition: opacity 0.12s ease;
    }

    .tooltip.visible {
      opacity: 1;
    }

    .tooltip-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .tooltip-toolbar .tooltip-title {
      margin-bottom: 0;
    }

    .tooltip-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-strong);
      margin-bottom: 6px;
    }

    .tooltip-row {
      display: flex;
      gap: 8px;
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.45;
      margin-bottom: 4px;
    }

    .tooltip-key {
      min-width: 76px;
      color: rgba(255, 255, 255, 0.32);
      flex-shrink: 0;
    }

    .tooltip-value {
      color: rgba(255, 255, 255, 0.74);
    }

    #pinnedCardsLayer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 55;
    }

    .pinned-card {
      position: fixed;
      width: 300px;
      padding: 14px;
      pointer-events: auto;
      z-index: 56;
    }

    .legend-swatch-list,
    .group-row-list {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .legend-row,
    .group-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border-radius: 12px;
      border: 1px solid var(--line-soft);
      background: rgba(255, 255, 255, 0.03);
      padding: 9px 10px;
    }

    .legend-row.is-muted,
    .group-row.is-muted {
      opacity: 0.38;
    }

    .legend-row-main,
    .group-row-main {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .legend-swatch {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      flex-shrink: 0;
      box-shadow: 0 0 16px currentColor;
    }

    .legend-label-text,
    .group-row-title {
      font-size: 12px;
      color: var(--text-strong);
    }

    .legend-subtext,
    .group-row-sub {
      font-family: var(--mono);
      font-size: 10px;
      color: rgba(255, 255, 255, 0.34);
    }

    .group-drop {
      width: 100%;
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.04);
      color: rgba(255, 255, 255, 0.74);
      border-radius: 12px;
      padding: 10px 12px;
      font-family: var(--mono);
      font-size: 11px;
      margin-top: 10px;
    }

    .group-helper {
      margin-top: 10px;
      font-size: 12px;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.48);
    }

    .empty-note {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.52);
      line-height: 1.5;
    }

    .focus-selection-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .focus-selection-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
      color: rgba(255, 255, 255, 0.76);
      font-family: var(--mono);
      font-size: 10px;
      line-height: 1;
      padding: 8px 10px;
      max-width: 100%;
    }

    .focus-selection-chip button {
      appearance: none;
      border: 0;
      background: transparent;
      color: rgba(255, 255, 255, 0.46);
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
      padding: 0;
    }

    .focus-selection-chip button:hover {
      color: rgba(255, 255, 255, 0.9);
    }

    .focus-graph-meta {
      margin-bottom: 12px;
      font-size: 12px;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.48);
    }

    .focus-graph-stage {
      border-radius: 14px;
      border: 1px solid var(--line-soft);
      background: rgba(255, 255, 255, 0.03);
      padding: 10px;
      overflow: hidden;
    }

    .focus-graph-empty {
      padding: 12px 2px 6px;
      font-size: 12px;
      line-height: 1.55;
      color: rgba(255, 255, 255, 0.56);
    }

    .focus-graph-svg {
      width: 100%;
      display: block;
    }

    @media (max-width: 1180px) {
      #filtersPanel,
      #detailPanel,
      #statsPanel,
      #searchPanel,
      #focusGraphPanel,
      #groupingPanel,
      #legendPanel {
        width: 290px;
      }
    }

    @media (max-width: 980px) {
      body {
        overflow: auto;
      }

      #app {
        height: auto;
        min-height: 100vh;
      }

      #graphWrap {
        position: relative;
        height: 72vh;
        min-height: 560px;
      }

      #filtersPanel,
      #statsPanel,
      #detailPanel,
      #searchPanel,
      #focusGraphPanel,
      #groupingPanel,
      #legendPanel,
      #titleBlock {
        position: relative;
        width: auto;
        left: auto;
        right: auto;
        top: auto;
        bottom: auto;
        margin: 16px;
        max-height: none;
      }

      #toolLauncher {
        position: relative;
        top: auto;
        left: auto;
        margin: 16px;
      }

      #titleBlock {
        margin-top: 6px;
        pointer-events: auto;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="graphWrap">

    ];

    const MAX_SELECTED_NODES = 3;

    const state = {
      filters: {
        jurisdictions: new Set(),
        roles: new Set(),
        categories: new Set(),
        layers: new Set(),
        resources: new Set(),
      },
      hovered: null,
      pinned: null,
      selectedNodes: [],
      tooltipTarget: null,
      tooltipPayload: null,
      tooltipHideTimer: null,
      lastTooltipPoint: { x: 0, y: 0 },
      searchResults: [],
      selectedSearchIndex: -1,
      toolMenuOpen: false,
      zCounter: 40,
      windows: {
        filtersPanel: { open: true, left: 20, top: 64, z: 41 },
        statsPanel: { open: true, left: Math.max(window.innerWidth - 350, 20), top: 20, z: 42 },
        detailPanel: { open: true, left: Math.max(window.innerWidth - 350, 20), top: 168, z: 43 },
        searchPanel: { open: true, left: Math.max(window.innerWidth - 350, 20), top: Math.max(window.innerHeight - 120, 20), z: 44 },
        focusGraphPanel: { open: false, left: Math.max(window.innerWidth - 380, 20), top: 316, z: 45 },
        groupingPanel: { open: false, left: 20, top: 306, z: 46 },
        legendPanel: { open: false, left: Math.max(window.innerWidth - 320, 20), top: 500, z: 47 },
      },
      draggingWindow: null,
      pinnedCards: [],
      draggingGroup: null,
      grouping: {
        actorBy: "dominantRole",
        lawBy: "jurisdiction",
        actorOrderByMode: {},
        lawOrderByMode: {},
      },
    };

    const SEARCH_INDEX = buildSearchIndex();

    function getWindowState(panelId) {
      return state.windows[panelId];
    }

    function nextZ() {
      state.zCounter += 1;
      return state.zCounter;
    }

    function bringWindowToFront(panelId) {
      const win = getWindowState(panelId);
      if (!win) return;
      win.z = nextZ();
      applyWindowState();
    }

    function toggleWindow(panelId, forceOpen) {
      const win = getWindowState(panelId);
      if (!win) return;
      win.open = typeof forceOpen === "boolean" ? forceOpen : !win.open;
      if (win.open) {
        win.z = nextZ();
      }
      renderToolMenu();
      applyWindowState();
    }

    function closeWindow(panelId) {
      const win = getWindowState(panelId);
      if (!win) return;
      win.open = false;
      renderToolMenu();
      applyWindowState();
    }

    function applyWindowState() {
      Object.entries(panelRegistry).forEach(([panelId, panel]) => {
        const win = getWindowState(panelId);
        if (!win) return;
        panel.classList.toggle("window-hidden", !win.open);
        panel.style.left = `${win.left}px`;
        panel.style.top = `${win.top}px`;
        panel.style.right = "auto";
        panel.style.bottom = "auto";
        panel.style.zIndex = String(win.z);
      });
    }

    function renderToolMenu() {
      toolLauncher.classList.toggle("open", state.toolMenuOpen);
      toolMenu.innerHTML = toolDefinitions.map(tool => {
        const win = getWindowState(tool.id);
        return `
          <button class="tool-menu-item ${win.open ? "active" : ""}" type="button" data-tool-window="${tool.id}">
            <span>${escapeHtml(tool.title)}</span>
            <span class="tool-menu-status">${win.open ? "open" : "closed"}</span>
          </button>
        `;
      }).join("");
      toolMenu.querySelectorAll("[data-tool-window]").forEach(button => {
        button.addEventListener("click", () => toggleWindow(button.getAttribute("data-tool-window")));
      });
    }

    function toggleToolMenu(force) {
      state.toolMenuOpen = typeof force === "boolean" ? force : !state.toolMenuOpen;
      renderToolMenu();
    }

    function getYearBand(year) {
      const numericYear = Number(year || 0);
      if (!numericYear) return "Unknown";
      if (numericYear < 1990) return "Pre 1990";
      if (numericYear < 2005) return "1990 to 2004";
      if (numericYear < 2015) return "2005 to 2014";
      return "2015 onward";
    }

    function sortRoleBreakdown(breakdown) {
      return [...(breakdown || [])].sort((left, right) => {
        const countDiff = (right.count || 0) - (left.count || 0);
        if (countDiff) return countDiff;
        return (roleIndex.get(left.label) ?? 999) - (roleIndex.get(right.label) ?? 999);
      });
    }

    function getDominantRoleLabel(breakdown) {
      return sortRoleBreakdown(breakdown)[0]?.label || "Other";
    }

    function getRoleMixLabel(breakdown) {
      const labels = sortRoleBreakdown(breakdown).map(item => item.label);
      if (!labels.length) return "Other";
      if (labels.length === 1) return labels[0];
      if (labels.length === 3) return "All Three Roles";
      return labels.join(" + ");
    }

    function getActorGroupValue(actor, mode) {
      if (mode === "none") return "__all__";
      if (mode === "category") return actor.category || "Other";
      if (mode === "dominantRole") return getDominantRoleLabel(actor.roleBreakdown);
      if (mode === "roleMix") return getRoleMixLabel(actor.roleBreakdown);
      if (mode === "topJurisdiction") return actor.jurisdictionBreakdown[0]?.label || "Other";
      if (mode === "topLayer") return actor.layerBreakdown[0]?.label || "Other";
      if (mode === "topResource") return actor.resourceBreakdown[0]?.label || "Other";
      if (mode === "degreeBand") {
        if (actor.degree >= 25) return "High Connectivity";
        if (actor.degree >= 10) return "Mid Connectivity";
        return "Low Connectivity";
      }
      return "__all__";
    }

    function getLawGroupValue(law, mode) {
      if (mode === "none") return "__all__";
      if (mode === "jurisdiction") return law.jurisdiction || "Other";
      if (mode === "layer") return law.layer || "Other";
      if (mode === "dominantRole") return getDominantRoleLabel(law.roleBreakdown);
      if (mode === "topCategory") return law.actorCategoryBreakdown[0]?.label || "Other";
      if (mode === "topResource") return law.resourceBreakdown[0]?.label || "Other";
      if (mode === "yearBand") {
        return getYearBand(law.year);
      }
      return "__all__";
    }

    function getGroupingMode(side) {
      return side === "actor" ? state.grouping.actorBy : state.grouping.lawBy;
    }

    function getNodeBySide(side, id) {
      return side === "actor" ? actorMap.get(id) : lawMap.get(id);
    }

    function getBaseOrder(side) {
      return side === "actor" ? actorBaseOrder : lawBaseOrder;
    }

    function getGroupKey(side, node, mode) {
      return side === "actor" ? getActorGroupValue(node, mode) : getLawGroupValue(node, mode);
    }

    function getStoredGroupOrder(side, mode) {
      const bucket = side === "actor" ? state.grouping.actorOrderByMode : state.grouping.lawOrderByMode;
      return bucket[mode];
    }

    function setStoredGroupOrder(side, mode, order) {
      const bucket = side === "actor" ? state.grouping.actorOrderByMode : state.grouping.lawOrderByMode;
      bucket[mode] = [...order];
    }

    function getGroupingState(side) {
      const mode = getGroupingMode(side);
      const baseOrder = getBaseOrder(side);
      const groupsMap = new Map();

      baseOrder.forEach(nodeId => {
        const node = getNodeBySide(side, nodeId);
        const key = getGroupKey(side, node, mode);
        if (!groupsMap.has(key)) groupsMap.set(key, []);
        groupsMap.get(key).push(nodeId);
      });

      let order = [...groupsMap.keys()];
      const storedOrder = getStoredGroupOrder(side, mode);
      if (storedOrder && storedOrder.length) {
        order = [
          ...storedOrder.filter(key => groupsMap.has(key)),
          ...order.filter(key => !storedOrder.includes(key)),
        ];
      } else {
        setStoredGroupOrder(side, mode, order);
      }

      const groups = order.map((key, index) => ({
        key,
        label: key === "__all__" ? (side === "actor" ? "All Actors" : "All Laws") : key,
        side,
        index,
        nodeIds: groupsMap.get(key) || [],
      }));

      return {
        mode,
        groups,
        orderedNodeIds: groups.flatMap(group => group.nodeIds),
      };
    }

    function updateGrouping(side, mode) {
      if (side === "actor") state.grouping.actorBy = mode;
      else state.grouping.lawBy = mode;
      render();
    }

    function normalizeText(value) {
      return String(value || "")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, " ")
        .trim();
    }

    function selectionKey(kind, id) {
      return `${kind}:${id}`;
    }

    function hasAnyFilters() {
      return Object.values(state.filters).some(bucket => bucket.size > 0);
    }

    function getSelectionMap() {
      const selectedActors = new Set();
      const selectedLaws = new Set();
      state.selectedNodes.forEach(item => {
        if (item.kind === "actor") selectedActors.add(item.id);
        if (item.kind === "law") selectedLaws.add(item.id);
      });
      return { selectedActors, selectedLaws };
    }

    function clearSelections(renderAfter = true) {
      state.selectedNodes = [];
      if (searchInput.value.trim()) updateSearchResults();
      if (renderAfter) render();
    }

    function registerSelection(kind, id) {
      const key = selectionKey(kind, id);
      if (state.selectedNodes.some(item => selectionKey(item.kind, item.id) == key)) {
        return false;
      }
      state.selectedNodes.push({ kind, id });
      if (state.selectedNodes.length > MAX_SELECTED_NODES) {
        state.selectedNodes = state.selectedNodes.slice(-MAX_SELECTED_NODES);
      }
      state.windows.focusGraphPanel.open = true;
      state.windows.focusGraphPanel.z = nextZ();
      return true;
    }

    function addSelection(kind, id, renderAfter = true) {
      registerSelection(kind, id);
      if (searchInput.value.trim()) updateSearchResults();
      if (renderAfter) render();
    }

    function toggleSelection(kind, id, renderAfter = true) {
      const key = selectionKey(kind, id);
      const exists = state.selectedNodes.some(item => selectionKey(item.kind, item.id) == key);
      if (exists) {
        state.selectedNodes = state.selectedNodes.filter(item => selectionKey(item.kind, item.id) != key);
      } else {
        registerSelection(kind, id);
      }
      if (searchInput.value.trim()) updateSearchResults();
      if (renderAfter) render();
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatCount(value) {
      return new Intl.NumberFormat("en-AU").format(value || 0);
    }

    function buildSearchIndex() {
      const items = [];

      GRAPH_DATA.actors.forEach(actor => {
        items.push({
          type: "Actors",
          key: normalizeText([actor.label, actor.category, actor.token].join(" ")),
          label: actor.label,
          sub: actor.category,
          selection: { kind: "actor", id: actor.id },
          action: () => setPinned({ kind: "actor", id: actor.id }),
        });
      });

      GRAPH_DATA.laws.forEach(law => {
        items.push({
          type: "Laws",
          key: normalizeText([law.label, law.jurisdiction, law.layer, law.year].join(" ")),
          label: law.label,
          sub: [law.jurisdiction, law.layer, law.year].filter(Boolean).join(" | "),
          selection: { kind: "law", id: law.id },
          action: () => setPinned({ kind: "law", id: law.id }),
        });
      });

      GRAPH_DATA.metadata.filters.jurisdictions.forEach(value => {
        items.push({
          type: "Jurisdictions",
          key: normalizeText(value),
          label: value,
          sub: "filter network",
          action: () => replaceSingleFilter("jurisdictions", value),
        });
      });

      GRAPH_DATA.metadata.filters.roles.forEach(value => {
        items.push({
          type: "Roles",
          key: normalizeText(value),
          label: value,
          sub: "filter network",
          action: () => replaceSingleFilter("roles", value),
        });
      });

      GRAPH_DATA.metadata.filters.resources.forEach(value => {
        items.push({
          type: "Resources",
          key: normalizeText(value),
          label: value,
          sub: "filter network",
          action: () => replaceSingleFilter("resources", value),
        });
      });

      return items;
    }

    function replaceSingleFilter(group, value) {
      state.filters[group].clear();
      state.filters[group].add(value);
      state.pinned = null;
      state.hovered = null;
      searchDropdown.classList.remove("visible");
      state.windows.filtersPanel.open = true;
      render();
    }

    function toggleFilter(group, value) {
      const bucket = state.filters[group];
      if (bucket.has(value)) {
        bucket.delete(value);
      } else {
        bucket.add(value);
      }
      state.pinned = null;
      render();
    }

    function clearFilters() {
      Object.values(state.filters).forEach(bucket => bucket.clear());
      state.hovered = null;
      state.pinned = null;
      searchInput.value = "";
      searchClear.style.display = "none";
      hideSearch();
      render();
    }

    function setPinned(target) {
      state.pinned = target;
      state.hovered = null;
      state.windows.detailPanel.open = true;
      state.windows.detailPanel.z = nextZ();
      hideSearch();
      render();
    }

    function setHovered(target) {
      state.hovered = target;
    }

    function clearHovered() {
      if (state.hovered) {
        state.hovered = null;
      }
    }

    function getFocus() {
      return state.pinned || null;
    }

    function edgeMatchesFilters(edge) {
      if (state.filters.jurisdictions.size && !state.filters.jurisdictions.has(edge.jurisdiction)) return false;
      if (state.filters.roles.size && !edge.roles.some(role => state.filters.roles.has(role))) return false;
      if (state.filters.categories.size && !state.filters.categories.has(edge.actorCategory)) return false;
      if (state.filters.layers.size && !state.filters.layers.has(edge.layer)) return false;
      if (state.filters.resources.size && !edge.resources.some(resource => state.filters.resources.has(resource))) return false;
      return true;
    }

    function getVisibleState() {
      const { selectedActors, selectedLaws } = getSelectionMap();
      const actorFilterActive = selectedActors.size > 0;
      const lawFilterActive = selectedLaws.size > 0;
      const visibleEdges = GRAPH_DATA.edges.filter(edge =>
        edgeMatchesFilters(edge) &&
        (!actorFilterActive || selectedActors.has(edge.actorId)) &&
        (!lawFilterActive || selectedLaws.has(edge.lawId))
      );
      const actorIds = new Set();
      const lawIds = new Set();
      visibleEdges.forEach(edge => {
        actorIds.add(edge.actorId);
        lawIds.add(edge.lawId);
      });

      if (actorFilterActive) {
        selectedActors.forEach(actorId => actorIds.add(actorId));
      }
      if (lawFilterActive) {
        selectedLaws.forEach(lawId => lawIds.add(lawId));
      }

      return {
        visibleEdges,
        actorIds,
        lawIds,
        hasHardFilter: hasAnyFilters() || actorFilterActive || lawFilterActive,
      };
    }

    function getSelectionState(visibleState) {
      const { selectedActors, selectedLaws } = getSelectionMap();
      const relatedActorIds = new Set(selectedActors);
      const relatedLawIds = new Set(selectedLaws);
      const relatedEdgeIds = new Set();

      visibleState.visibleEdges.forEach(edge => {
        const touchesSelection = selectedActors.has(edge.actorId) || selectedLaws.has(edge.lawId);
        if (touchesSelection) {
          relatedEdgeIds.add(edge.id);
          relatedActorIds.add(edge.actorId);
          relatedLawIds.add(edge.lawId);
        }
      });

      return {
        hasSelection: state.selectedNodes.length > 0,
        selectedActors,
        selectedLaws,
        relatedActorIds,
        relatedLawIds,
        relatedEdgeIds,
      };
    }

    function getVisibleCountForGroup(side, group, visibleState) {
      const visibleSet = side === "actor" ? visibleState.actorIds : visibleState.lawIds;
      return group.nodeIds.filter(nodeId => visibleSet.has(nodeId)).length;
    }

    function getNodeRadius(node) {
      return Math.max(6, Math.min(15, 6 + Math.sqrt(node.degree) * 1.55));
    }

    function getLayout() {
      const rect = svg.getBoundingClientRect();
      const width = Math.max(960, rect.width || window.innerWidth);
      const height = Math.max(640, rect.height || window.innerHeight);
      const top = 110;
      const bottom = height - 88;
      const actorX = Math.max(178, width * 0.18);
      const lawX = Math.min(width - 200, width * 0.82);
      const actorGrouping = getGroupingState("actor");
      const lawGrouping = getGroupingState("law");
      const actorPositions = new Map();
      const lawPositions = new Map();

      function placeSide(grouping, x, positions, side) {
        const headerHeight = grouping.mode === "none" ? 0 : 30;
        const groupGap = grouping.mode === "none" ? 0 : 16;
        const availableHeight = bottom - top;
        const totalNodes = Math.max(grouping.orderedNodeIds.length, 1);
        const reserved = grouping.groups.length * headerHeight + Math.max(grouping.groups.length - 1, 0) * groupGap;
        const usableHeight = Math.max(availableHeight - reserved, totalNodes * 8);
        const nodeGap = usableHeight / Math.max(totalNodes - 1, 1);
        let cursorY = top;
        const groupLayouts = [];

        grouping.groups.forEach((group, index) => {
          const headerY = grouping.mode === "none" ? cursorY : cursorY;
          if (grouping.mode !== "none") cursorY += headerHeight;
          const startY = cursorY;
          group.nodeIds.forEach((nodeId, nodeIndex) => {
            positions.set(nodeId, { x, y: startY + nodeGap * nodeIndex });
          });
          const nodeCountHeight = group.nodeIds.length > 1 ? nodeGap * (group.nodeIds.length - 1) : 0;
          const endY = startY + nodeCountHeight;
          cursorY = endY + groupGap;
          groupLayouts.push({
            key: group.key,
            label: group.label,
            index,
            side,
            y: headerY,
            centerY: grouping.mode === "none" ? startY : headerY + headerHeight / 2,
            x,
            nodeCount: group.nodeIds.length,
            nodeIds: [...group.nodeIds],
          });
        });
        return groupLayouts;
      }

      const actorGroups = placeSide(actorGrouping, actorX, actorPositions, "actor");
      const lawGroups = placeSide(lawGrouping, lawX, lawPositions, "law");

      return {
        width,
        height,
        actorPositions,
        lawPositions,
        actorX,
        lawX,
        actorGrouping,
        lawGrouping,
        actorGroups,
        lawGroups,
      };
    }

    function edgePath(edge, layout, offsetY = 0) {
      const source = layout.actorPositions.get(edge.actorId);
      const target = layout.lawPositions.get(edge.lawId);
      const midX = (source.x + target.x) / 2;
      const y1 = source.y + offsetY;
      const y2 = target.y + offsetY;
      const midY = (y1 + y2) / 2;
      const jurisdictionOffset = (jurisdictionIndex.get(edge.jurisdiction) - (jurisdictionIndex.size - 1) / 2) * 14;
      const roleOffset = (roleIndex.get(edge.primaryRole) - 1) * 10;
      const bundleOffset = jurisdictionOffset + roleOffset;
      const innerLeft = source.x + (midX - source.x) * 0.72;
      const innerRight = target.x - (target.x - midX) * 0.72;
      const ridge = midY + bundleOffset * 0.2;
      const ridgeXLeft = midX - 54;
      const ridgeXRight = midX + 54;
      return [
        "M", source.x, y1,
        "C", innerLeft, y1, ridgeXLeft, ridge, midX, ridge,
        "C", ridgeXRight, ridge, innerRight, y2, target.x, y2,
      ].join(" ");
    }

    function getEdgeRenderSegments(edge, mode, visual) {
      if (mode === "dominantRole" || mode === "roleMix") {
        const sortedRoles = sortRoleBreakdown(edge.roleBreakdown);
        return sortedRoles.map((item, index) => ({
          color: roleColors[item.label] || "#9ca3af",
          width: Math.max(1.15, visual.width * 0.68),
          opacity: visual.opacity,
          dash: item.label === "Rule User" ? "3 6" : "",
          offset: (index - (sortedRoles.length - 1) / 2) * 5,
        }));
      }
      return [{
        color: visual.color,
        width: visual.width,
        opacity: visual.opacity,
        dash: visual.dash,
        offset: 0,
      }];
    }

    function isEdgeActive(edge, focus) {
      if (!focus) return false;
      if (focus.kind === "actor") return edge.actorId === focus.id;
      if (focus.kind === "law") return edge.lawId === focus.id;
      if (focus.kind === "edge") return edge.id === focus.id;
      return false;
    }

    function isEdgeNeighbor(edge, focus) {
      if (!focus || focus.kind !== "edge") return false;
      const selected = edgeMap.get(focus.id);
      if (!selected) return false;
      return (
        edge.actorId === selected.actorId ||
        edge.lawId === selected.lawId
      );
    }

    function getActiveEdgeColorMode(focus, selectionState) {
      if (state.filters.roles.size) return "dominantRole";
      if (state.filters.jurisdictions.size) return "jurisdiction";
      if (state.filters.categories.size) return "category";
      if (state.filters.layers.size) return "layer";

      const actorMode = state.grouping.actorBy;
      const lawMode = state.grouping.lawBy;

      if (focus?.kind === "actor" || (selectionState.selectedActors.size && !selectionState.selectedLaws.size)) {
        return actorMode;
      }
      if (focus?.kind === "law" || (selectionState.selectedLaws.size && !selectionState.selectedActors.size)) {
        return lawMode;
      }
      if (focus?.kind === "edge") {
        if (actorMode && actorMode !== "none") return actorMode;
        if (lawMode && lawMode !== "none") return lawMode;
      }
      if (actorMode && actorMode !== "none") return actorMode;
      if (lawMode && lawMode !== "none") return lawMode;
      return "none";
    }

    function getNodeColorForMode(node, side, mode) {
      if (side === "actor") {
        if (mode === "category" || mode === "topCategory") {
          return actorCategoryColors[node.category] || "#cbd5e1";
        }
        if (mode === "dominantRole" || mode === "roleMix") {
          return roleColors[getDominantRoleLabel(node.roleBreakdown)] || "#cbd5e1";
        }
        if (mode === "jurisdiction" || mode === "topJurisdiction") {
          return jurisdictionColors[node.jurisdictionBreakdown?.[0]?.label] || "#cbd5e1";
        }
        if (mode === "layer" || mode === "topLayer") {
          return layerColors[node.layerBreakdown?.[0]?.label] || layerColors.Unknown;
        }
      } else {
        if (mode === "category" || mode === "topCategory") {
          return actorCategoryColors[node.actorCategoryBreakdown?.[0]?.label] || "#cbd5e1";
        }
        if (mode === "dominantRole" || mode === "roleMix") {
          return roleColors[getDominantRoleLabel(node.roleBreakdown)] || "#cbd5e1";
        }
        if (mode === "jurisdiction" || mode === "topJurisdiction") {
          return jurisdictionColors[node.jurisdiction] || "#cbd5e1";
        }
        if (mode === "layer" || mode === "topLayer") {
          return layerColors[node.layer] || layerColors.Unknown;
        }
        if (mode === "yearBand") {
          return yearBandColors[getYearBand(node.year)] || yearBandColors.Unknown;
        }
      }
      return node.color || "#cbd5e1";
    }

    function getEdgeColorForMode(edge, mode) {
      if (mode === "dominantRole" || mode === "roleMix") {
        return roleColors[edge.primaryRole] || "#9ca3af";
      }
      if (mode === "category" || mode === "topCategory") {
        return actorCategoryColors[edge.actorCategory] || "#cbd5e1";
      }
      if (mode === "jurisdiction" || mode === "topJurisdiction") {
        return jurisdictionColors[edge.jurisdiction] || "#cbd5e1";
      }
      if (mode === "layer" || mode === "topLayer") {
        return layerColors[edge.layer] || layerColors.Unknown;
      }
      if (mode === "yearBand") {
        return yearBandColors[getYearBand(edge.year)] || yearBandColors.Unknown;
      }
      return "rgba(220,220,230,0.78)";
    }

    function getEdgeLegendRows(mode) {
      if (mode === "dominantRole" || mode === "roleMix") {
        return {
          title: "Role colours",
          subtitle: "links follow role type",
          rows: Object.entries(roleColors).map(([label, color]) => ({ label, color })),
        };
      }
      if (mode === "category" || mode === "topCategory") {
        return {
          title: "Actor category colours",
          subtitle: "links follow actor category",
          rows: Object.entries(actorCategoryColors).map(([label, color]) => ({ label, color })),
        };
      }
      if (mode === "jurisdiction" || mode === "topJurisdiction") {
        return {
          title: "Jurisdiction colours",
          subtitle: "links follow jurisdiction",
          rows: Object.entries(jurisdictionColors).map(([label, color]) => ({ label, color })),
        };
      }
      if (mode === "layer" || mode === "topLayer") {
        return {
          title: "Layer colours",
          subtitle: "links follow layer",
          rows: Object.entries(layerColors).map(([label, color]) => ({ label, color })),
        };
      }
      if (mode === "yearBand") {
        return {
          title: "Year band colours",
          subtitle: "links follow year band",
          rows: Object.entries(yearBandColors).map(([label, color]) => ({ label, color })),
        };
      }
      return {
        title: "Neutral links",
        subtitle: "links stay muted in this lens",
        rows: [{ label: "Neutral", color: "rgba(220,220,230,0.78)" }],
      };
    }

    function getEdgeVisual(edge, visibleEdgeIds, focus, selectionState, visibleState) {
      const isVisible = visibleEdgeIds.has(edge.id);
      const isActive = isEdgeActive(edge, focus);
      const isNeighbor = isEdgeNeighbor(edge, focus);
      const selectionMatch = selectionState.hasSelection && selectionState.relatedEdgeIds.has(edge.id);
      const edgeColorMode = getActiveEdgeColorMode(focus, selectionState);
      let opacity = isVisible ? 0.42 : 0;
      let width = 0.8 + Math.min(2.5, Math.log(edge.mappingCount + 1));
      let color = "rgba(220,220,230,0.78)";

      if (selectionState.hasSelection) {
        if (selectionMatch) {
          opacity = 0.85;
          width += 0.9;
        } else {
          opacity = 0;
        }
      }

      if (focus) {
        if (isActive) {
          opacity = 0.88;
          width += 1.4;
        } else if (
          (focus.kind === "actor" && edge.actorId === focus.id) ||
          (focus.kind === "law" && edge.lawId === focus.id)
        ) {
          opacity = 0.72;
          width += 0.7;
        } else if (isNeighbor) {
          opacity = 0.16;
        } else {
          opacity = visibleState.hasHardFilter ? 0 : (isVisible ? 0.05 : 0);
        }
      }

      if (focus || selectionState.hasSelection || visibleState.hasHardFilter) {
        color = getEdgeColorForMode(edge, edgeColorMode);
      }

      return {
        opacity,
        width,
        color,
        dash: edge.primaryRole === "Rule User" ? "3 6" : "",
      };
    }

    function getNodeVisual(node, side, visibleState, focus, selectionState) {
      const connected = side === "actor" ? visibleState.actorIds.has(node.id) : visibleState.lawIds.has(node.id);
      const focusEdge = focus && focus.kind === "edge" ? edgeMap.get(focus.id) : null;
      const selectionRelated = side === "actor" ? selectionState.relatedActorIds.has(node.id) : selectionState.relatedLawIds.has(node.id);
      const explicitlySelected = side === "actor" ? selectionState.selectedActors.has(node.id) : selectionState.selectedLaws.has(node.id);
      const activeColorMode = getActiveEdgeColorMode(focus, selectionState);
      const modeColor = getNodeColorForMode(node, side, activeColorMode);
      const isFocus =
        focus &&
        ((focus.kind === "actor" && side === "actor" && focus.id === node.id) ||
        (focus.kind === "law" && side === "law" && focus.id === node.id) ||
        (focus.kind === "edge" && focusEdge && (focusEdge.actorId === node.id || focusEdge.lawId === node.id)));

      let labelOpacity = connected ? 0.72 : 0;
      let fillOpacity = connected ? 0.2 : 0;
      let strokeOpacity = connected ? 0.62 : 0;
      let haloOpacity = connected ? 0.1 : 0;
      let fillColor = "rgba(204,204,214,0.9)";
      let strokeColor = "rgba(204,204,214,0.95)";

      if (hasAnyFilters() && !connected) {
        labelOpacity = 0;
        fillOpacity = 0;
        strokeOpacity = 0;
        haloOpacity = 0;
      }

      if (selectionState.hasSelection) {
        if (explicitlySelected) {
          labelOpacity = 0.96;
          fillOpacity = 0.38;
          strokeOpacity = 0.96;
          haloOpacity = 0.28;
          fillColor = modeColor;
          strokeColor = modeColor;
        } else if (selectionRelated) {
          labelOpacity = 0.82;
          fillOpacity = 0.22;
          strokeOpacity = 0.76;
          haloOpacity = 0.18;
          fillColor = modeColor;
          strokeColor = modeColor;
        } else {
          labelOpacity = 0;
          fillOpacity = 0;
          strokeOpacity = 0;
          haloOpacity = 0;
        }
      }

      if (focus) {
        const related =
          (focus.kind === "actor" && side === "law" && GRAPH_DATA.edges.some(edge => edge.actorId === focus.id && edge.lawId === node.id && edgeMatchesFilters(edge))) ||
          (focus.kind === "law" && side === "actor" && GRAPH_DATA.edges.some(edge => edge.lawId === focus.id && edge.actorId === node.id && edgeMatchesFilters(edge))) ||
          (focus.kind === "edge" && focusEdge && (focusEdge.actorId === node.id || focusEdge.lawId === node.id));

        if (isFocus) {
          fillOpacity = 0.34;
          strokeOpacity = 0.92;
          haloOpacity = 0.26;
          labelOpacity = 0.92;
          fillColor = modeColor;
          strokeColor = modeColor;
        } else if (related) {
          fillOpacity = 0.22;
          strokeOpacity = 0.7;
          haloOpacity = 0.16;
          labelOpacity = 0.82;
          fillColor = modeColor;
          strokeColor = modeColor;
        } else {
          if (visibleState.hasHardFilter) {
            fillOpacity = 0;
            strokeOpacity = 0;
            haloOpacity = 0;
            labelOpacity = 0;
          } else {
            fillOpacity = connected ? 0.06 : 0;
            strokeOpacity = connected ? 0.12 : 0;
            haloOpacity = connected ? 0.02 : 0;
            labelOpacity = connected ? 0.22 : 0;
          }
        }
      }

      if (activeColorMode !== "none" && connected && (focus || selectionState.hasSelection || visibleState.hasHardFilter)) {
        fillColor = modeColor;
        strokeColor = modeColor;
      }

      return { connected, isFocus, labelOpacity, fillOpacity, strokeOpacity, haloOpacity, fillColor, strokeColor };
    }

    function renderGraph() {
      const layout = getLayout();
      svg.setAttribute("viewBox", `0 0 ${layout.width} ${layout.height}`);

      const visibleState = getVisibleState();
      const selectionState = getSelectionState(visibleState);
      const focus = getFocus();
      const visibleEdgeIds = new Set(visibleState.visibleEdges.map(edge => edge.id));

      let defs = `
        <defs>
          <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="3" result="blur"></feGaussianBlur>
            <feMerge>
              <feMergeNode in="blur"></feMergeNode>
              <feMergeNode in="SourceGraphic"></feMergeNode>
            </feMerge>
          </filter>
        </defs>
      `;

      let guides = `
        <g opacity="0.18">
          <text x="${layout.actorX - 62}" y="64" fill="rgba(255,255,255,0.18)" style="font-family: var(--mono);" font-size="10" letter-spacing="2.4">ACTORS</text>
          <text x="${layout.lawX - 20}" y="64" fill="rgba(255,255,255,0.18)" style="font-family: var(--mono);" font-size="10" letter-spacing="2.4">LAWS</text>
          <line x1="${layout.actorX}" y1="84" x2="${layout.actorX}" y2="${layout.height - 56}" stroke="rgba(255,255,255,0.05)" />
          <line x1="${layout.lawX}" y1="84" x2="${layout.lawX}" y2="${layout.height - 56}" stroke="rgba(255,255,255,0.05)" />
        </g>
      `;

      const actorGroupMarkup = layout.actorGrouping.mode === "none" ? "" : layout.actorGroups.map(group => {
        const visibleCount = getVisibleCountForGroup("actor", group, visibleState);
        const inactive = visibleCount === 0;
        return `
          <g class="group-header ${inactive ? "is-muted" : ""}" data-group-side="actor" data-group-key="${escapeHtml(group.key)}" transform="translate(${layout.actorX - 148}, ${group.y})" style="cursor: ns-resize; opacity:${inactive ? 0.26 : 1};">
            <rect x="0" y="0" rx="11" ry="11" width="140" height="24" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)"></rect>
            <text x="10" y="15" fill="rgba(255,255,255,0.66)" style="font-family: var(--mono);" font-size="10">${escapeHtml(group.label)}</text>
            <text x="130" y="15" text-anchor="end" fill="rgba(255,255,255,0.24)" style="font-family: var(--mono);" font-size="9">${formatCount(visibleCount)}/${formatCount(group.nodeCount)}</text>
          </g>
        `;
      }).join("");

      const lawGroupMarkup = layout.lawGrouping.mode === "none" ? "" : layout.lawGroups.map(group => {
        const visibleCount = getVisibleCountForGroup("law", group, visibleState);
        const inactive = visibleCount === 0;
        return `
          <g class="group-header ${inactive ? "is-muted" : ""}" data-group-side="law" data-group-key="${escapeHtml(group.key)}" transform="translate(${layout.lawX + 24}, ${group.y})" style="cursor: ns-resize; opacity:${inactive ? 0.26 : 1};">
            <rect x="0" y="0" rx="11" ry="11" width="140" height="24" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)"></rect>
            <text x="10" y="15" fill="rgba(255,255,255,0.66)" style="font-family: var(--mono);" font-size="10">${escapeHtml(group.label)}</text>
            <text x="130" y="15" text-anchor="end" fill="rgba(255,255,255,0.24)" style="font-family: var(--mono);" font-size="9">${formatCount(visibleCount)}/${formatCount(group.nodeCount)}</text>
          </g>
        `;
      }).join("");

      const edgeMarkup = GRAPH_DATA.edges.map(edge => {
        const visual = getEdgeVisual(edge, visibleEdgeIds, focus, selectionState, visibleState);
        if (visual.opacity <= 0) return "";
        const segments = getEdgeRenderSegments(edge, getActiveEdgeColorMode(focus, selectionState), visual);
        return segments.map(segment => `
          <path
            class="edge"
            data-edge-id="${escapeHtml(edge.id)}"
            d="${edgePath(edge, layout, segment.offset)}"
            fill="none"
            stroke="${segment.color}"
            stroke-opacity="${segment.opacity}"
            stroke-width="${segment.width}"
            stroke-linecap="round"
            ${segment.dash ? `stroke-dasharray="${segment.dash}"` : ""}
          ></path>
        `).join("");
      }).join("");

      const actorMarkup = GRAPH_DATA.actors.map(actor => {
        const pos = layout.actorPositions.get(actor.id);
        const visual = getNodeVisual(actor, "actor", visibleState, focus, selectionState);
        if (!visual.connected && visibleState.hasHardFilter) return "";
        const radius = getNodeRadius(actor);
        return `
          <g class="node actor-node" data-node-kind="actor" data-node-id="${escapeHtml(actor.id)}" transform="translate(${pos.x}, ${pos.y})">
            <circle r="${radius + 4}" fill="none" stroke="${visual.strokeColor}" stroke-opacity="${visual.haloOpacity}" stroke-width="1.2" filter="url(#softGlow)"></circle>
            <circle r="${radius}" fill="${visual.fillColor}" fill-opacity="${visual.fillOpacity}" stroke="${visual.strokeColor}" stroke-opacity="${visual.strokeOpacity}" stroke-width="1.25"></circle>
            <text x="-14" y="4" text-anchor="end" fill="rgba(255,255,255,${visual.labelOpacity})" font-size="10.5" style="font-family: var(--display);">${escapeHtml(actor.label)}</text>
          </g>
        `;
      }).join("");

      const lawMarkup = GRAPH_DATA.laws.map(law => {
        const pos = layout.lawPositions.get(law.id);
        const visual = getNodeVisual(law, "law", visibleState, focus, selectionState);
        if (!visual.connected && visibleState.hasHardFilter) return "";
        const radius = getNodeRadius(law);
        return `
          <g class="node law-node" data-node-kind="law" data-node-id="${escapeHtml(law.id)}" transform="translate(${pos.x}, ${pos.y})">
            <circle r="${radius + 4}" fill="none" stroke="${visual.strokeColor}" stroke-opacity="${visual.haloOpacity}" stroke-width="1.2" filter="url(#softGlow)"></circle>
            <circle r="${radius}" fill="${visual.fillColor}" fill-opacity="${visual.fillOpacity}" stroke="${visual.strokeColor}" stroke-opacity="${visual.strokeOpacity}" stroke-width="1.25"></circle>
            <text x="14" y="4" text-anchor="start" fill="rgba(255,255,255,${visual.labelOpacity})" font-size="10.5" style="font-family: var(--display);">${escapeHtml(law.label)}</text>
          </g>
        `;
      }).join("");

      svg.innerHTML = defs + guides + `<g id="groupLayer">${actorGroupMarkup}${lawGroupMarkup}</g><g id="edgesLayer">${edgeMarkup}</g><g id="nodesLayer">${actorMarkup}${lawMarkup}</g>`;

      svg.querySelectorAll(".edge").forEach(element => {
        element.addEventListener("mouseenter", event => {
          const edgeId = event.currentTarget.getAttribute("data-edge-id");
          const edge = edgeMap.get(edgeId);
          showTooltipForEdge(edge, event);
          setHovered({ kind: "edge", id: edgeId });
        });
        element.addEventListener("mousemove", event => moveTooltip(event));
        element.addEventListener("mouseleave", () => {
          hideTooltip();
          clearHovered();
        });
        element.addEventListener("click", event => {
          event.stopPropagation();
          const edgeId = event.currentTarget.getAttribute("data-edge-id");
          setPinned({ kind: "edge", id: edgeId });
        });
      });

      svg.querySelectorAll(".node").forEach(element => {
        element.addEventListener("mouseenter", event => {
          const kind = event.currentTarget.getAttribute("data-node-kind");
          const nodeId = event.currentTarget.getAttribute("data-node-id");
          if (kind === "actor") {
            showTooltipForActor(actorMap.get(nodeId), event);
          } else {
            showTooltipForLaw(lawMap.get(nodeId), event);
          }
          setHovered({ kind, id: nodeId });
        });
        element.addEventListener("mousemove", event => moveTooltip(event));
        element.addEventListener("mouseleave", () => {
          hideTooltip();
          clearHovered();
        });
        element.addEventListener("click", event => {
          event.stopPropagation();
          const kind = event.currentTarget.getAttribute("data-node-kind");
          const nodeId = event.currentTarget.getAttribute("data-node-id");
          if (kind === "actor") {
            showTooltipForActor(actorMap.get(nodeId), event);
          } else {
            showTooltipForLaw(lawMap.get(nodeId), event);
          }
          pinCurrentTooltip();
          toggleSelection(kind, nodeId, false);
          setPinned({ kind, id: nodeId });
        });
      });

      svg.querySelectorAll(".group-header").forEach(element => {
        element.addEventListener("mousedown", event => {
          event.preventDefault();
          event.stopPropagation();
          state.draggingGroup = {
            side: event.currentTarget.getAttribute("data-group-side"),
            key: event.currentTarget.getAttribute("data-group-key"),
          };
        });
      });

      svg.onclick = event => {
        if (event.target === svg) {
          state.pinned = null;
          state.selectedNodes = [];
          render();
        }
      };
    }

    function renderFilters() {
      const filterSections = [
        { key: "jurisdictions", label: "Jurisdictions", colors: jurisdictionColors },
        { key: "roles", label: "Roles", colors: roleColors },
        { key: "categories", label: "Actor Categories", colors: actorCategoryColors },
        { key: "layers", label: "Layers", colors: { Federal: "#93c5fd", State: "#6ee7b7", Territory: "#fb923c" } },
      ];

      const html = [
        `<div class="window-handle">
          <div class="window-title-wrap">
            <span class="window-kicker">Tool</span>
            <h2>Filters</h2>
          </div>
          <div class="window-actions">
            <button class="clear-btn" id="clearFiltersBtn" type="button">Reset all</button>
            <button class="window-close" type="button" data-close-window="filtersPanel" aria-label="Close Filters">&times;</button>
          </div>

      ];

      filterSections.forEach(section => {
        html.push(`<div class="filters-group"><div class="section-label">${escapeHtml(section.label)}</div><div class="chip-grid">`);
        GRAPH_DATA.metadata.filters[section.key].forEach(value => {
          const active = state.filters[section.key].has(value);
          const color = section.colors[value] || "#cbd5e1";
          const count = getFilterCount(section.key, value);
          html.push(`
            <button class="chip ${active ? "active" : ""}" data-filter-group="${section.key}" data-filter-value="${escapeHtml(value)}">
              <span class="chip-color" style="background:${color}; color:${color};"></span>
              <span class="chip-text">
                <span class="chip-label">${escapeHtml(value)}</span>
                <span class="chip-count">${formatCount(count)} links</span>
              </span>
            </button>
          `);
        });
        html.push(`</div></div>`);
      });

      html.push(`<div class="filters-group"><div class="section-label">Resource search</div><div class="empty-note" style="margin-top:10px">Use the search box to filter down to specific resources like Water, Electricity, Personal Information, or Data Centre Facility.</div></div>`);

      filtersPanel.innerHTML = html.join("");
      const clearButton = document.getElementById("clearFiltersBtn");
      clearButton.addEventListener("click", clearFilters);
      filtersPanel.querySelectorAll("[data-filter-group]").forEach(button => {
        button.addEventListener("click", () => {
          toggleFilter(button.getAttribute("data-filter-group"), button.getAttribute("data-filter-value"));
        });
      });
    }

    function getFilterCount(group, value) {
      return GRAPH_DATA.edges.filter(edge => {
        if (group === "jurisdictions") return edge.jurisdiction === value;
        if (group === "roles") return edge.roles.includes(value);
        if (group === "categories") return edge.actorCategory === value;
        if (group === "layers") return edge.layer === value;
        if (group === "resources") return edge.resources.includes(value);
        return false;
      }).length;
    }

        ${state.selectedNodes.length ? `<div class="toolbar-row"><div class="section-label">${formatCount(state.selectedNodes.length)} selected nodes</div><button class="ghost-btn" id="clearSelectionsBtn" type="button">Clear selection</button></div>` : ""}
        <div class="stats-grid">

      `;

    function renderDetail() {
